<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>풋살 MBTI · 풋살장에서의 나는?</title>
  <meta name="description" content="여성 풋살러를 위한 풋살 성격 테스트. 20문항으로 알아보는 나의 풋살 유형 16가지." />
  <meta property="og:title" content="풋살 MBTI · 풋살장에서의 나는?" />
  <meta property="og:description" content="풋살장에서의 나를 발견하는 16가지 풋살 성격 테스트" />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#0f3d2e" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app">
    <!-- 시작 화면 -->
    <section id="screen-intro" class="screen active">
      <div class="pitch-badge">WOMEN'S FUTSAL</div>
      <h1>풋살 <span class="hl">MBTI</span></h1>
      <p class="lead"><b>풋살장에서의 나</b>를 발견하는<br />16가지 풋살 성격 테스트</p>


      <form id="name-form" class="card">
        <label for="name-input">닉네임을 알려주세요</label>
        <input id="name-input" type="text" maxlength="12" placeholder="예) 고라니" autocomplete="off" required />
        <button type="submit" class="btn primary">테스트 시작하기 →</button>
        <p class="hint">20문항</p>
      </form>
    </section>

    <!-- 문항 화면 -->
    <section id="screen-quiz" class="screen">
      <div class="quiz-top">
        <button class="btn icon" id="btn-back" aria-label="이전 문항">←</button>
        <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
        <span class="progress-text" id="progress-text">1/20</span>
      </div>
      <div class="question-wrap">
        <p class="q-num" id="q-num">Q1</p>
        <h2 class="q-text" id="q-text"></h2>
        <div class="options">
          <button class="option" id="opt-a"></button>
          <button class="option" id="opt-b"></button>
        </div>
      </div>
    </section>

    <!-- 결과 화면: 선수 스카우팅 리포트 -->
    <section id="screen-result" class="screen">
      <article class="report">
        <header class="report-head">
          <span>FUTSAL PLAYER REPORT</span>
          <span id="report-no"></span>
        </header>

        <div class="report-hero">
          <p class="result-owner" id="result-owner"></p>
          <h2 class="result-name" id="result-name"></h2>
        </div>

        <div class="letters" id="letters"></div>

        <div class="report-body">
          <div class="quote-box">
            <span class="quote-label">제일 많이 하는 말</span>
            <blockquote class="result-quote" id="result-quote"></blockquote>
          </div>
          <p class="result-desc" id="result-desc"></p>
          <section class="position">
            <div class="position-text">
              <h3>추천 포지션</h3>
              <p class="position-name" id="result-role"></p>
              <ul id="position-desc"></ul>
            </div>
            <svg class="pitch" viewBox="0 0 120 180" aria-hidden="true">
              <rect x="4" y="4" width="112" height="172" rx="3" class="pl" />
              <line x1="4" y1="90" x2="116" y2="90" class="pl" />
              <circle cx="60" cy="90" r="14" class="pl" />
              <circle cx="60" cy="90" r="1.5" class="pd" />
              <path d="M30 4 A30 30 0 0 0 90 4" class="pl" />
              <path d="M30 176 A30 30 0 0 1 90 176" class="pl" />
              <rect x="50" y="0.5" width="20" height="3.5" class="pl" />
              <rect x="50" y="176" width="20" height="3.5" class="pl" />
              <g class="spot" data-pos="피보"><circle cx="60" cy="40" r="7" /><text x="60" y="55">피보</text></g>
              <g class="spot" data-pos="알라"><circle cx="24" cy="92" r="7" /><text x="24" y="107">알라</text></g>
              <g class="spot" data-pos="알라"><circle cx="96" cy="92" r="7" /><text x="96" y="107">알라</text></g>
              <g class="spot" data-pos="픽소"><circle cx="60" cy="134" r="7" /><text x="60" y="149">픽소</text></g>
              <g class="spot gk"><circle cx="60" cy="164" r="5" /></g>
            </svg>
          </section>

          <section class="player">
            <p class="player-label">나랑 닮은 선수</p>
            <p class="player-name"><b id="player-name"></b><span id="player-nation"></span></p>
            <p class="player-why" id="player-why"></p>
          </section>

          <section class="block">
            <h3><em>01</em>플레이 스타일</h3>
            <ul id="result-play"></ul>
          </section>
          <section class="block">
            <h3><em>02</em>풋살 멘탈</h3>
            <ul id="result-mental"></ul>
          </section>
          <section class="block">
            <h3><em>03</em>팀원 관계</h3>
            <ul id="result-team"></ul>
          </section>
          <section class="block">
            <h3><em>04</em>나의 무기</h3>
            <ul><li id="result-strength"></li></ul>
          </section>
          <section class="block">
            <h3><em>05</em>성장 포인트</h3>
            <ul><li id="result-tip"></li></ul>
          </section>
        </div>
      </article>

      <h3 class="match-heading">나랑 같은 팀이 되면?</h3>
      <div class="match-grid">
        <article class="match good" id="match-good"></article>
        <article class="match bad" id="match-bad"></article>
      </div>

      <div class="actions">
        <button class="btn primary" id="btn-share">결과 공유하기</button>
        <button class="btn ghost" id="btn-retry">다시 하기</button>
      </div>
    </section>

    <div class="toast" id="toast"></div>
  </main>

  <footer>Made for women futsallers · 실력이 아닌 성향 테스트입니다</footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
